next_platform_verification:
  platforms:
    - "视频号"
    - "抖音"
    - "小红书"
  required_fields:
    - "官方账号名称"
    - "主页链接或平台内唯一标识"
    - "最近10条内容日期"
    - "近30天发布数量"
    - "主要选题与内容形式"
  rule: "只有公开网页活跃而短视频平台长期不更新的账号，保留为选题源，不用于短视频表现对标"

review_rules:
  compare_on:
    - "目标用户"
    - "近30天高频选题"
    - "标题和开头"
    - "内容结构"
    - "案例与证据"
    - "发布频率"
    - "收藏、转发和咨询动机"
    - "产品承接方式"
  do_not_copy:
    - "逐字脚本"
    - "他人案例或未经授权素材"
    - "无法核实的效果数字"
