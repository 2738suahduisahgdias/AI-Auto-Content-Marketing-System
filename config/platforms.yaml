publish_defaults:
  videos_per_week_min: 3
  videos_per_week_target: 4
  videos_per_week_max: 5
  long_guides_per_month: 2
  master_short_video_duration: "90-180s"
  long_guide_duration: "10-30min"
  human_review_required: true
  auto_publish: false

weekly_rhythm:
  - slot: 1
    pillar: "enterprise_ai"
    topic_type: "企业场景或案例"
  - slot: 2
    pillar: "ai_learning"
    topic_type: "岗位实操"
  - slot: 3
    pillar: "ai_marketing"
    topic_type: "AI获客工作流"
  - slot: 4
    pillar: "enterprise_ai_or_ai_learning"
    topic_type: "根据数据补一条企业案例或教程"
  - slot: 5
    pillar: "personal_thinking"
    topic_type: "可选，用真实思考替代低质量凑更"

repurposing:
  long_guide_outputs:
    - "1条10-30分钟完整攻略"
    - "2-4条独立短视频"
    - "1篇公众号长文"
    - "1份清单或模板"
  rule: "每个短视频切片必须能独立理解，不直接使用缺乏上下文的长视频片段"
