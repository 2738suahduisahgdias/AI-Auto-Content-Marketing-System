<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>全自动AI内容营销平台</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">AI</span><div><strong>全自动内容营销</strong><small>Multi-Agent Workspace</small></div></div>
    <nav aria-label="主导航">
      <button class="nav-item active" data-view="today"><span>今</span>今天</button>
      <div class="nav-group"><div class="nav-group-title">选题</div>
        <button class="nav-item nav-subitem" data-view="industry"><span>行</span>行业热点</button>
        <button class="nav-item nav-subitem" data-view="douyin"><span>抖</span>抖音选题</button>
        <button class="nav-item nav-subitem" data-view="wechat"><span>视</span>视频号选题</button>
        <button class="nav-item nav-subitem" data-view="xiaohongshu"><span>红</span>小红书选题</button>
      </div>
      <div class="nav-group"><div class="nav-group-title">账号</div>
        <button class="nav-item nav-subitem" data-view="accounts"><span>报</span>账号日报</button>
        <button class="nav-item nav-subitem" data-view="publish"><span>发</span>发布与复盘</button>
      </div>
      <div class="nav-group"><div class="nav-group-title">任务</div>
        <button class="nav-item nav-subitem" data-view="articles"><span>文</span>文章任务</button>
        <button class="nav-item nav-subitem" data-view="tasks"><span>视</span>视频任务</button>
      </div>
      <button class="nav-item" data-view="knowledge"><span>知</span>知识库</button>
      <button class="nav-item" data-view="settings"><span>设</span>设置</button>
    </nav>
    <div class="side-bottom">
      <div class="local-status"><i></i><div>仅在这台电脑运行<small>数据保存在本地 SQLite</small></div></div>
      <div id="capabilities" class="capabilities"></div>
    </div>
  </aside>
  <main>
    <header class="topbar"><div><p id="date-label"></p><h1 id="view-title">今天</h1></div><button id="new-task-top" class="button primary">＋ 新建任务</button></header>
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <section id="today" class="view active"></section>
    <section id="topics" class="view"></section>
    <section id="wechat" class="view"></section>
    <section id="xiaohongshu" class="view"></section>
    <section id="tasks" class="view"></section>
    <section id="articles" class="view"></section>
    <section id="accounts" class="view"></section>
    <section id="publish" class="view"></section>
    <section id="knowledge" class="view"></section>
    <section id="settings" class="view"></section>
  </main>
  <div id="loading" class="loading"><span></span>正在打开本地工作流…</div>
  <script src="/app.js"></script>
  <script src="/workspaces.js"></script>
</body>
</html>
