<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>内容工作流</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">C</span><div><strong>内容工作流</strong><small>本地创作台</small></div></div>
    <nav aria-label="主导航">
      <button class="nav-item active" data-view="today"><span>今</span>今天</button>
      <button class="nav-item" data-view="topics"><span>选</span>选题</button>
      <button class="nav-item" data-view="tasks"><span>作</span>任务</button>
      <button class="nav-item" data-view="accounts"><span>号</span>账号</button>
      <button class="nav-item" data-view="settings"><span>设</span>设置</button>
    </nav>
    <div class="side-bottom">
      <div class="local-status"><i></i><div>仅在这台电脑运行<small>数据保存在本地 SQLite</small></div></div>
      <div id="capabilities" class="capabilities"></div>
    </div>
  </aside>
  <main>
    <header class="topbar"><div><p id="date-label"></p><h1 id="view-title">今天</h1></div><button id="new-task-top" class="button primary">＋ 新建任务</button></header>
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <section id="today" class="view active"></section>
    <section id="topics" class="view"></section>
    <section id="tasks" class="view"></section>
    <section id="accounts" class="view"></section>
    <section id="settings" class="view"></section>
  </main>
  <div id="loading" class="loading"><span></span>正在打开本地工作流…</div>
  <script src="/app.js"></script>
</body>
</html>
