<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>刘量 · 授权管理</title>
<style>body{margin:0;background:#f9f8f6;color:#29241f;font:15px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:1160px;margin:40px auto;padding:0 24px}h1{font-size:30px}small,p{color:#746a60;line-height:1.7}.grid{display:grid;grid-template-columns:350px 1fr;gap:24px}section{background:#fff;border:1px solid #e7e0d7;border-radius:12px;padding:24px;margin:20px 0}label{display:block;margin:14px 0 6px}input,textarea,select{box-sizing:border-box;width:100%;padding:11px;border:1px solid #cdbda8;border-radius:8px;font:inherit;background:#fff}textarea{resize:both;max-width:100%;min-height:85px}button{background:#b85b0b;color:white;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;margin:8px 4px 0 0;font:inherit}button.secondary{background:#f5f1eb;color:#746a60}button:disabled{opacity:.5}article{border-top:1px solid #eee3d6;padding:15px 0}#notice{white-space:pre-wrap;color:#b93f36;min-height:24px}#output{min-height:110px}code{word-break:break-all}.tools{display:flex;flex-wrap:wrap;gap:4px}@media(max-width:800px){.grid{grid-template-columns:1fr}}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #b85b0b33;outline-offset:2px}button:hover:not(:disabled){filter:brightness(.96)}</style>
<main><small>刘量 · 经营者本地工具</small><h1>客户与授权管理</h1><p>客户素材与视频不会上传到这里。此处只保存客户备注和发码记录。离线授权无法知道实际激活或使用情况，也不能远程撤销旧码。</p><div id="notice" role="status"></div>
<section id="initialize" hidden><h2>建立你的签发身份</h2><p>依赖 OpenSSL 3+。私钥以密码加密保存在本机，密码至少 12 字符，不会保存。请先备份私钥再给客户发码。</p><label>私钥密码<input id="initPassword" type="password" autocomplete="new-password"></label><label>再次输入私钥密码<input id="initPasswordConfirm" type="password" autocomplete="new-password"></label><label>恢复已有加密私钥（可选）<input id="restoreKey" type="file" accept=".pem"></label><button id="init">创建／恢复签发身份</button></section>
<div class="grid"><section><h2>签发授权</h2><label>客户称呼<input id="name" maxlength="100"></label><label>微信备注<input id="wechat" maxlength="200"></label><label>客户申请码<textarea id="requestCode" placeholder="YXREQ1.…"></textarea></label><label>类型<select id="kind"><option>正式</option><option>试用</option><option>续期</option><option>换机补发</option></select></label><label>有效期<select id="term"><option value="30">30 天</option><option value="7">7 天</option><option value="365">365 天</option><option value="custom">自定义天数</option><option value="long">长期</option></select></label><input id="days" type="number" aria-label="自定义天数" value="30" min="1" max="3650" hidden><label>关联原授权<select id="parentId"><option value="">首次发码</option></select></label><label>行业、需求与跟进备注<textarea id="notes"></textarea></label><label>私钥密码<input id="password" type="password" autocomplete="off"></label><button id="issue">生成并保存授权码</button><button id="saveNotes" class="secondary" hidden>保存当前记录备注</button><p>有效期从本次签发开始计算。续期与换机保留关联记录；旧机授权不会自动失效。</p></section>
<div><section><h2>交给客户</h2><label>授权码<textarea id="output" readonly></textarea></label><button id="copy">复制授权码</button><button id="export">下载授权文件</button><p>客户在原工作台的“离线授权”页粘贴或导入即可。</p></section><section><h2>客户记录</h2><input id="search" aria-label="搜索客户" placeholder="搜索称呼、微信或授权编号"><div id="records"></div></section></div></div>
<section><h2>备份与客户端公钥</h2><div class="tools"><button id="public" class="secondary">导出客户端公钥</button><button id="backup" class="secondary">备份客户记录</button><button id="keyBackup" class="secondary">备份加密私钥</button></div><label>恢复客户记录（合并，不覆盖已有记录）<input id="restore" type="file" accept=".json"></label><p>公钥可随客户安装包分发；私钥文件与密码只由你保管。客户记录备份不包含私钥。恢复私钥需在一个新的空白管理目录操作。</p><small id="root"></small></section></main>
<script>
let state={},csrf='',selected=null;const $=id=>document.getElementById(id);const note=t=>$('notice').textContent=t;
async function request(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json','X-CSRF-Token':csrf}:{},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error);return data}
function download(name,text,type='application/json'){const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function choose(r){selected=r;$('output').value=r.token;for(const k of ['name','wechat','notes'])$(k).value=r[k]||'';$('saveNotes').hidden=false}
function render(){const q=$('search').value.toLowerCase();$('records').replaceChildren();for(const r of (state.records||[]).filter(r=>(r.name+r.wechat+r.licenseId).toLowerCase().includes(q))){const a=document.createElement('article');const title=document.createElement('strong');title.textContent=r.name+' · 已发码';const p=document.createElement('p');p.textContent=`微信：${r.wechat||'未填写'} · ${r.kind||'授权'} · ${r.expiresAt?'到期 '+new Date(r.expiresAt).toLocaleDateString():'长期'}\n授权编号：${r.licenseId} · 备注：${r.notes||'未填写'}${r.parentId?' · 关联原授权：'+r.parentId:''}`;const b=document.createElement('button');b.className='secondary';b.textContent='查看／导出';b.onclick=()=>choose(r);const renew=document.createElement('button');renew.className='secondary';renew.textContent='续期／补发';renew.onclick=()=>{for(const k of ['name','wechat','requestCode','notes'])$(k).value=r[k]||'';$('parentId').value=r.licenseId;$('kind').value='续期';note('已带入客户资料；换机时请替换为新机器申请码。')};a.append(title,p,b,renew);$('records').append(a)}if(!$('records').children.length)$('records').textContent='还没有匹配的客户记录'}
async function load(){state=await request('/api/status');csrf=state.csrf;$('initialize').hidden=state.initialized;$('issue').disabled=!state.initialized;$('root').textContent='本地管理目录：'+state.root;const prior=$('parentId').value;$('parentId').replaceChildren(new Option('首次发码',''));for(const r of state.records)$('parentId').add(new Option(r.name+' · '+r.licenseId.slice(0,8),r.licenseId));$('parentId').value=prior;render()}
async function action(button,fn){button.disabled=true;try{await fn()}catch(e){note(e.message)}finally{button.disabled=false}}
$('init').onclick=e=>action(e.target,async()=>{if($('initPassword').value!==$('initPasswordConfirm').value)throw Error('两次私钥密码不一致');const file=$('restoreKey').files[0];await request('/api/initialize',{password:$('initPassword').value,backup:file?await file.text():undefined});$('initPassword').value='';$('initPasswordConfirm').value='';await load();note('签发身份已就绪。请分别备份加密私钥与客户记录。')});
$('issue').onclick=e=>action(e.target,async()=>{const body={};for(const k of ['name','wechat','requestCode','notes','kind','parentId','password'])body[k]=$(k).value;body.days=$('term').value==='long'?null:Number($('term').value==='custom'?$('days').value:$('term').value);try{choose(await request('/api/issue',body));await load();note('授权已签发并保存。请发给客户；此记录不代表客户已激活。')}finally{$('password').value=''}});
$('saveNotes').onclick=e=>action(e.target,async()=>{if(!selected)return;const body={licenseId:selected.licenseId};for(const k of ['name','wechat','notes'])body[k]=$(k).value;choose(await request('/api/customer',body));await load();note('当前发码记录的客户备注已保存；授权内容未改变')});
$('term').onchange=()=>$('days').hidden=$('term').value!=='custom';$('search').oninput=render;
$('copy').onclick=e=>action(e.target,async()=>{if(!selected)throw Error('先选择或生成一条授权');await navigator.clipboard.writeText(selected.token);note('授权码已复制')});$('export').onclick=()=>{if(selected)download('yingxu-'+selected.licenseId+'.yxlicense',selected.token,'text/plain');else note('先选择或生成一条授权')};
$('public').onclick=()=>download('public-keys.json',JSON.stringify(state.publicKeys,null,2));$('backup').onclick=()=>download('yingxu-customers.json',JSON.stringify(state.records,null,2));$('keyBackup').onclick=e=>action(e.target,async()=>{const data=await request('/api/key-backup');download('yingxu-signing-key.encrypted.pem',data.encryptedPem,'text/plain');note('加密私钥已导出，请与密码分开保管。')});$('restore').onchange=e=>action(e.target,async()=>{const f=e.target.files[0];if(f){await request('/api/restore',{records:JSON.parse(await f.text())});await load();note('客户记录已合并恢复')}});load().catch(e=>note(e.message));
</script></html>
