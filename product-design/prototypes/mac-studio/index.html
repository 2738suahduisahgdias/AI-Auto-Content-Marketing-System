<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>映序 · Mac 创作工作台</title><link rel="stylesheet" href="studio.css"></head>
<body><div class="app-window"><aside class="sidebar"><div class="brand"><span class="brand-mark">映</span><div>映序<span>YINGXU STUDIO</span></div></div><div class="workspace"><span class="avatar">L</span><div>我的创作空间<small>本地工作空间</small></div><span class="local-dot" title="本地界面演示"></span></div><div class="nav-caption">工作空间</div><nav id="navigation"></nav><div class="nav-caption recent-caption">最近项目</div><button class="recent" data-project="客服"><span class="project-dot"></span>AI 客服如何落地</button><button class="recent" data-project="产品"><span class="project-dot mint"></span>让产品自己说话</button><div class="side-bottom"><button class="side-link" data-modal="settings"><span data-icon="sliders"></span>管理与设置</button><button class="side-link" data-modal="help"><span data-icon="help"></span>帮助与联系</button><div class="storage"><div><span data-icon="hard-drive"></span> 本机文件 · 界面演示</div><small>项目数据不会上传</small></div></div></aside>
<div class="main-shell"><header class="toolbar"><div class="breadcrumbs"><span>工作空间</span><span class="slash">/</span><strong id="page-title">内容项目</strong></div><div class="toolbar-right"><span class="prototype-label">设计预览</span><button class="icon-button" id="appearance" aria-label="切换深浅色" title="切换深浅色"><span data-icon="moon"></span></button><span class="avatar small">L</span></div></header><main id="content"></main></div></div><dialog id="modal"><div class="dialog-head"><h2 id="modal-title"></h2><button class="icon-button" id="close-modal" aria-label="关闭弹窗">×</button></div><div id="modal-content"></div></dialog><div class="toast" id="toast" role="status" hidden></div><script src="studio.js"></script></body></html>
