<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>刘量内容增长工作台 · 产品 Demo</title>
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <div class="demo-ribbon">产品交互 Demo · 全部为模拟数据 · 不调用模型、不渲染、不发布、不写正式数据库</div>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-symbol">L</div><div><strong>刘量</strong><span>内容增长工作台</span></div></div>
      <div class="workspace-switch"><span class="workspace-avatar">企</span><div><strong>AI 落地实战派</strong><small>个人工作区</small></div><span class="chevron">⌄</span></div>
      <nav id="main-nav" aria-label="主导航"></nav>
      <div class="sidebar-bottom">
        <div class="agent-online"><span class="pulse"></span><div><strong>Agent 工作正常</strong><small><span id="running-count">3</span> 个任务正在执行</small></div></div>
        <button class="sidebar-settings" data-nav="settings" aria-label="设置"><span data-icon="settings"></span><span>设置与自动化</span></button>
        <div class="local-note">本地工作区 · 数据由你掌控</div>
      </div>
    </aside>
    <main class="main-shell">
      <header class="global-header">
        <button class="mobile-menu" aria-label="打开菜单"><span data-icon="menu"></span></button>
        <div class="global-search"><span data-icon="search"></span><input id="global-search" placeholder="搜索项目、素材、选题…"><kbd>⌘ K</kbd></div>
        <div class="header-actions"><button class="icon-button" title="通知" data-action="notifications"><span data-icon="bell"></span><i></i></button><button class="primary-button compact" data-action="new-project"><span data-icon="plus"></span>新建内容项目</button><div class="user-avatar">刘</div></div>
      </header>
      <div class="page-container">
        <section id="view-today" class="view active"></section>
        <section id="view-topics" class="view"></section>
        <section id="view-projects" class="view"></section>
        <section id="view-article" class="view"></section>
        <section id="view-video" class="view"></section>
        <section id="view-assets" class="view"></section>
        <section id="view-publish" class="view"></section>
        <section id="view-agents" class="view"></section>
        <section id="view-settings" class="view"></section>
      </div>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="demo.js"></script>
</body>
</html>
